<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>地名検索 | 全国1741市町村ルーレット</title>
    <meta name="description" content="日本全国1,741の市区町村を、漢字・かな・ローマ字・都道府県名から検索できます。">

    <link rel="stylesheet" href="search.css">
</head>

<body>

    <header id="pageHeader">
        <a id="siteLink" href="index.html">全国1741市町村ルーレット</a>
        <div id="pageTitleRow">
            <a id="backLink" href="index.html">← ルーレットに戻る</a>
            <h1>地名検索</h1>
        </div>
        <p id="pageSub">市区町村名・かな・ローマ字・都道府県名で検索できます</p>
    </header>

    <main>
        <div id="searchTop">
            <div id="searchLeft">
                <input type="search" id="searchInput" placeholder="例: 名護、なごし、Nago、沖縄県" autocomplete="off">
                <p id="searchCount">上の欄に地名を入力してください</p>
                <ul id="searchResults"></ul>
            </div>

            <div id="searchRight">
                <p id="handwriteNote">✏️ 手書きでも検索できます（Googleの手書き文字認識・非公式機能）</p>
                <canvas id="handwriteCanvas" width="280" height="280"></canvas>
                <div id="handwriteButtons">
                    <button id="handwriteUndoBtn" type="button">一画戻す</button>
                    <button id="handwriteClearBtn" type="button">消す</button>
                </div>
                <p id="handwriteStatus">枠の中に文字を書いてください</p>
                <div id="handwriteCandidates"></div>
            </div>
        </div>
    </main>

    <script src="municipalities.js"></script>
    <script src="search.js"></script>

</body>

</html>
